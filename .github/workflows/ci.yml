name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (debug)
        run: swift build

      - name: Run test suite
        run: swift test

      - name: Build (release)
        run: swift build -c release

      - name: Run CLI end-to-end self-test
        run: .build/release/MouseSwitch --self-test
